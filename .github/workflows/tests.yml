name: Package checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        django: ['>=5.2,<5.3', '>=6.0,<6.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]' build 'Django${{ matrix.django }}'
      - run: python -m pytest -m 'not browser'
      - run: ruff check modern_admin tests
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed distribution outside checkout
        run: cd /tmp && python "$GITHUB_WORKSPACE/tests/installed_smoke.py"
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        django: ['>=5.2,<5.3', '>=6.0,<6.1']
        postgres: ['14', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: modern_admin
          POSTGRES_PASSWORD: modern_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MODERN_ADMIN_POSTGRES: '1'
      PGDATABASE: modern_admin
      PGUSER: postgres
      PGPASSWORD: modern_admin_test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,postgres]' 'Django${{ matrix.django }}'
      - run: python -m pytest -m 'not browser'
      - run: python manage.py makemigrations --check --dry-run
