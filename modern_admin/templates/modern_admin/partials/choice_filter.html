{% load modern_admin %}
<details class="ma-choice-filter{% if filter.active_label %} is-active{% endif %}" x-data="{ term: '', opened: false }" @toggle="opened=$el.open" @click.outside="$el.open=false" @keydown.escape.stop="$el.open=false; $el.querySelector('summary').focus()">
  <summary aria-label="{{ filter.label }}"><span>{{ filter.active_label|default:filter.label }}</span>{% icon "chevron-down" 13 %}</summary>
  <div class="ma-popover ma-choice-options"{% if auto_submit %} x-floating="opened"{% endif %}>
    <input class="ma-choice-search" type="search" placeholder="Find an option…" aria-label="Search {{ filter.label }} options" x-model="term" @keydown.enter.prevent>
    <div class="ma-choice-list">
      {% if filter.kind != 'multiple_choice' %}
        <label><input type="radio" name="{{ filter.key }}" value=""{% if not filter.active_label %} checked{% endif %}{% if auto_submit %} @change="$el.closest('details').open=false; $el.form.requestSubmit()"{% endif %}><span>Any {{ filter.label|lower }}</span></label>
      {% endif %}
      {% for option in filter.options %}
        <label x-show="$el.textContent.toLocaleLowerCase().includes(term.toLocaleLowerCase())"><input type="{% if filter.kind == 'multiple_choice' %}checkbox{% else %}radio{% endif %}" name="{{ filter.key }}" value="{{ option.value }}"{% if option.selected %} checked{% endif %}{% if auto_submit %} @change="$el.closest('details').open=false; $el.form.requestSubmit()"{% endif %}><span>{{ option.label }}</span></label>
      {% endfor %}
    </div>
  </div>
</details>
