{% load modern_admin %}
<details class="ma-choice-filter{% if filter.active_label %} is-active{% endif %}" x-data="relationFilter" data-label="{{ filter.label }}" data-selected-label="{{ filter.options.0.label }}" :class="{ 'is-active': hasValue }" data-url="{{ filter.autocomplete_url }}" data-auto-submit="{{ auto_submit|yesno:'true,false' }}" @toggle="toggled" @click.outside="closeOptions" @keydown.escape.stop="escape">
  <summary aria-label="{{ filter.label }}"><span x-text="summary()">{{ filter.active_label|default:filter.label }}</span>{% icon "chevron-down" 13 %}</summary>
  <div class="ma-popover ma-choice-options"{% if auto_submit %} x-floating="opened"{% endif %}>
    <input class="ma-choice-search" type="search" placeholder="Search all records…" aria-label="Search {{ filter.label }} options" x-model="term" @input.debounce.200ms="search" @keydown.enter.prevent>
    <button type="button" class="ma-relation-option" @click="clearValue" :aria-pressed="!hasValue">Any {{ filter.label|lower }}</button>
    <p role="status" aria-live="polite" x-text="status"></p>
    <div class="ma-choice-list" x-ref="results"></div>
    <div class="ma-page-actions">
      <button type="button" class="ma-button is-ghost" @click="previous" :disabled="!hasPrevious">Previous</button>
      <button type="button" class="ma-button is-ghost" @click="next" :disabled="!hasNext">Next</button>
    </div>
    <input class="ma-input" type="text" :type="'hidden'" name="{{ filter.key }}" value="{{ filter.value }}" x-ref="value" placeholder="Record ID" aria-label="{{ filter.label }} record ID">
  </div>
</details>
