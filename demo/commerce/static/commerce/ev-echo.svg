<svg id="ev-still" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ev-title ev-description">
  <title id="ev-title">Galeria Echo w Kielcach — przyjazd i ładowanie SUV-a</title>
  <desc id="ev-description">An electric SUV drives up to a charging pedestal in front of the curved glass facade of Galeria Echo, Świętokrzyska 20, Kielce. The building is reconstructed as a restrained vector illustration from a reference photograph. The charging layout and telemetry are illustrative. Reduced motion shows the parked vehicle at seventy-percent charge.</desc>
  <!-- Building reference: https://www.epp-poland.com/obiekty/galeria-echo/
       Charging location: https://galeriaecho.pl/udogodnienia/stacja-ladowania-samochodow-elektrycznych/
       Original vector drawing; no external assets or live telemetry. -->
  <defs>
    <linearGradient id="ev-paint" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#CFD8D2"/><stop offset=".45" stop-color="#B7C1BC"/><stop offset="1" stop-color="#84968A"/></linearGradient>
    <linearGradient id="ev-hood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#CBD4CE"/><stop offset="1" stop-color="#A0B1A5"/></linearGradient>
    <linearGradient id="ev-glass" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#4A5751"/><stop offset=".5" stop-color="#202B27"/><stop offset="1" stop-color="#101A16"/></linearGradient>
    <linearGradient id="ev-stone" x1="0" y1="0" x2="1" y2="1"><stop class="ev-stone-light" stop-color="#A9B2AC"/><stop class="ev-stone-dark" offset="1" stop-color="#7F8B83"/></linearGradient>
    <linearGradient id="ev-mirror" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#26342E"/><stop offset=".5" stop-color="#718279"/><stop offset="1" stop-color="#3B4740"/></linearGradient>
    <linearGradient id="ev-half"><stop offset=".5" stop-color="#31E6A1" stop-opacity=".65"/><stop offset=".5" stop-color="#31E6A1" stop-opacity=".06"/></linearGradient>
    <radialGradient id="ev-shadow"><stop stop-color="#111815" stop-opacity=".23"/><stop offset="1" stop-color="#111815" stop-opacity="0"/></radialGradient>
    <linearGradient id="ev-edge-fade"><stop stop-color="black"/><stop offset=".035" stop-color="white"/><stop offset=".97" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="ev-scene-mask"><rect width="1600" height="900" fill="url(#ev-edge-fade)"/></mask>
    <clipPath id="ev-scene-clip"><rect width="1600" height="900"/></clipPath>
    <clipPath id="ev-echo-glass-clip"><path d="M340 281C356 192 625 143 880 184C1067 214 1189 299 1195 357V566C952 544 611 549 340 585Z"/></clipPath>
    <linearGradient id="ev-echo-glass"><stop stop-color="#829B8E" stop-opacity=".25"/><stop offset=".45" stop-color="#BBC8BE" stop-opacity=".1"/><stop offset="1" stop-color="#4A6757" stop-opacity=".28"/></linearGradient>
    <path id="ev-cable-path" pathLength="1" d="M700 624C736 629 685 757 745 763S776 660 814 657"/>
    <path id="ev-battery-route" pathLength="1" d="M814 657Q838 686 962 718L1256 711"/>
    <path id="ev-contour" pathLength="1" d="M784 617L806 532Q813 505 855 500L1120 501Q1165 506 1267 591L1370 611Q1420 623 1436 650"/>
    <filter id="ev-glow" x="-15%" y="-45%" width="130%" height="190%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.5" result="blur"/><feComponentTransfer in="blur" result="soft"><feFuncA type="linear" slope=".25"/></feComponentTransfer><feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    :root { --ev-building: #E0E5E1; --ev-building-side: #CBD3CD; --ev-trim: #AAB6AD; --ev-plaza: #A0AAA1; --ev-ink: #4A5751; --ev-campus-opacity: .72; }
    @media (prefers-color-scheme: dark) {
      :root { --ev-building: #303C35; --ev-building-side: #27332C; --ev-trim: #4A5A50; --ev-plaza: #536157; --ev-ink: #A8B6AB; --ev-campus-opacity: .72; }
    }
    @media (prefers-color-scheme: dark) { .ev-stone-light { stop-color: #637269; } .ev-stone-dark { stop-color: #3F4D43; } }
    .ev-detail { fill: none; stroke: #7F8B86; stroke-width: 1.4; }
    .ev-campus { opacity: var(--ev-campus-opacity); }
    /* Twelve seconds: approach 0–25%, connect 28–34%, charge 34–86%, depart 92–100%. */
    .ev-drive { animation: ev-arrive 12s infinite; }
    @keyframes ev-arrive {
      0% { transform: translateX(-1540px); animation-timing-function: cubic-bezier(.15,.65,.25,1); }
      25%,92% { transform: translateX(0); animation-timing-function: cubic-bezier(.55,0,.85,.45); }
      100% { transform: translateX(950px); }
    }
    .ev-wheel { animation: ev-roll 12s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ev-roll {
      0% { transform: rotate(0deg); animation-timing-function: cubic-bezier(.15,.65,.25,1); }
      25%,92% { transform: rotate(1800deg); animation-timing-function: cubic-bezier(.55,0,.85,.45); }
      100% { transform: rotate(2910deg); }
    }
    /* Cable is drawn only after parking; it retracts before departure. */
    .ev-connection { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ev-connect 12s ease-in-out infinite; }
    @keyframes ev-connect { 0%,28%,91%,100% { stroke-dashoffset: 1; opacity: 0; } 29% { opacity: 1; } 34%,87% { stroke-dashoffset: 0; opacity: 1; } }
    .ev-charging { animation: ev-charge-window 12s ease-in-out infinite; opacity: 0; }
    @keyframes ev-charge-window { 0%,33%,90%,100% { opacity: 0; } 36%,85% { opacity: 1; } }
    .ev-stream { fill: none; stroke: #31E6A1; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: .035 .095; animation: ev-flow 1.8s linear infinite; }
    @keyframes ev-flow { to { stroke-dashoffset: -.26; } }
    /* Five battery cells remain synchronized with the parked charging interval. */
    .ev-cell { fill: #31E6A1; opacity: .06; animation: ev-cell-5 12s ease-in-out infinite; }
    .ev-cell-1 { animation-name: ev-cell-1; }
    .ev-cell-2 { animation-name: ev-cell-2; }
    .ev-cell-3 { animation-name: ev-cell-3; }
    .ev-cell-4 { animation-name: ev-cell-4; }
    @keyframes ev-cell-1 { 0%,32%,100% { opacity: .06; } 37%,94% { opacity: .65; } }
    @keyframes ev-cell-2 { 0%,43%,100% { opacity: .06; } 48%,94% { opacity: .65; } }
    @keyframes ev-cell-3 { 0%,54%,100% { opacity: .06; } 59%,94% { opacity: .65; } }
    @keyframes ev-cell-4 { 0%,65%,100% { opacity: .06; } 70%,94% { opacity: .65; } }
    @keyframes ev-cell-5 { 0%,76%,100% { opacity: .06; } 81%,94% { opacity: .65; } }
    /* Small mathematical branches grow from the chassis, then dissolve together. */
    .ev-branch { fill: none; stroke: #1FA978; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; animation: ev-grow 12s cubic-bezier(.22,.61,.36,1) infinite; }
    .ev-twig { animation-name: ev-grow-twig; stroke-width: 1; }
    @keyframes ev-grow { 0%,40% { stroke-dashoffset: 1; opacity: 0; } 48% { opacity: .45; } 74%,82% { stroke-dashoffset: 0; opacity: .45; } 90%,100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes ev-grow-twig { 0%,52% { stroke-dashoffset: 1; opacity: 0; } 60% { opacity: .3; } 78%,82% { stroke-dashoffset: 0; opacity: .3; } 90%,100% { stroke-dashoffset: 0; opacity: 0; } }
    /* Sparse particles follow the cable into the pack. */
    .ev-particle { fill: none; stroke: #76F7C1; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: .001 .999; animation: ev-particle 3s linear infinite; }
    @keyframes ev-particle { from { stroke-dashoffset: 0; opacity: 0; } 12%,85% { opacity: .65; } to { stroke-dashoffset: -1; opacity: 0; } }
    .ev-pulse { fill: none; stroke: #76F7C1; stroke-width: 2; stroke-dasharray: .14 .86; opacity: 0; animation: ev-complete 12s ease-in-out infinite; }
    @keyframes ev-complete { 0%,80% { stroke-dashoffset: .14; opacity: 0; } 82% { opacity: .5; } 87% { opacity: .3; } 90%,100% { stroke-dashoffset: -1; opacity: 0; } }
    /* An accessible still frame: parked, connected, 70% charged. */
    @media (prefers-reduced-motion: reduce) {
      .ev-drive, .ev-wheel, .ev-connection, .ev-charging, .ev-stream, .ev-cell, .ev-branch, .ev-particle, .ev-pulse { animation: none !important; }
      .ev-drive, .ev-wheel { transform: none; }
      .ev-connection { stroke-dashoffset: 0; opacity: 1; }
      .ev-charging { opacity: 1; }
      .ev-stream { stroke-dasharray: none; opacity: .4; }
      .ev-particle, .ev-pulse { display: none; }
      .ev-branch { stroke-dashoffset: 0; opacity: .2; }
      .ev-cell { opacity: .06; }
      .ev-cell-1, .ev-cell-2, .ev-cell-3 { opacity: .65; }
      .ev-cell-4 { fill: url(#ev-half); opacity: 1; }
    }
    /* Static fragment also lets picture sources honor emulated motion preferences. */
    :root:target .ev-drive, :root:target .ev-wheel, :root:target .ev-connection, :root:target .ev-charging, :root:target .ev-stream, :root:target .ev-cell, :root:target .ev-branch, :root:target .ev-particle, :root:target .ev-pulse { animation: none !important; }
    :root:target .ev-drive, :root:target .ev-wheel { transform: none; }
    :root:target .ev-connection { stroke-dashoffset: 0; opacity: 1; }
    :root:target .ev-charging { opacity: 1; }
    :root:target .ev-stream { stroke-dasharray: none; opacity: .4; }
    :root:target .ev-particle, :root:target .ev-pulse { display: none; }
    :root:target .ev-branch { stroke-dashoffset: 0; opacity: .2; }
    :root:target .ev-cell { opacity: .06; }
    :root:target .ev-cell-1, :root:target .ev-cell-2, :root:target .ev-cell-3 { opacity: .65; }
    :root:target .ev-cell-4 { fill: url(#ev-half); opacity: 1; }
  </style>
