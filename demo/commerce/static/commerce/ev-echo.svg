      <path d="M116 590L628 610M727 603L1240 595M110 640H617M131 677H606" fill="none" stroke="var(--ev-plaza)" stroke-width="1.5" opacity=".3"/>
      <path d="M48 798H1552M90 828H420M540 828H870M990 828H1320" fill="none" stroke="var(--ev-plaza)" stroke-width="2" opacity=".25"/>
      <path d="M1180 604H1515L1550 779H801" fill="none" stroke="var(--ev-plaza)" stroke-width="2" opacity=".3"/>
    </g>
    <!-- Illustrative charging pedestal beside the foreground stopping position. -->
    <g id="charger">
      <ellipse cx="681" cy="753" rx="72" ry="16" fill="url(#ev-shadow)"/>
      <path d="M648 551L689 540L715 553V734L674 748L648 735Z" fill="#B7C1BC" stroke="#7F8B86" stroke-width="1.2"/>
