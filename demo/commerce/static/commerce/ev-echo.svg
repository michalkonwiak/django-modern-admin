      <path d="M957 742L1249 734M798 721L827 731" stroke="#40564A" stroke-width="6"/>
      <g transform="translate(892 720)"><ellipse rx="53" ry="58" fill="#111815" stroke="#4A5751" stroke-width="2"/><ellipse rx="36" ry="42" fill="#85918B"/><g transform="scale(.95 1.1)"><g class="ev-wheel" fill="#29332F"><circle r="34" fill="#5E6C64"/><path d="M-4-8L-10-32Q2-37 15-28L7-5Z" transform="rotate(0)"/><path d="M-4-8L-10-32Q2-37 15-28L7-5Z" transform="rotate(72)"/><path d="M-4-8L-10-32Q2-37 15-28L7-5Z" transform="rotate(144)"/><path d="M-4-8L-10-32Q2-37 15-28L7-5Z" transform="rotate(216)"/><path d="M-4-8L-10-32Q2-37 15-28L7-5Z" transform="rotate(288)"/><circle r="8" fill="#AAB5AE"/></g></g></g>
      <g transform="translate(1320 703)"><ellipse rx="53" ry="58" fill="#111815" stroke="#4A5751" stroke-width="2"/><ellipse rx="36" ry="42" fill="#85918B"/><g transform="scale(.95 1.1)"><g class="ev-wheel" fill="#29332F"><circle r="34" fill="#5E6C64"/><path d="M-4-8L-10-32Q2-37 15-28L7-5Z" transform="rotate(0)"/><path d="M-4-8L-10-32Q2-37 15-28L7-5Z" transform="rotate(72)"/><path d="M-4-8L-10-32Q2-37 15-28L7-5Z" transform="rotate(144)"/><path d="M-4-8L-10-32Q2-37 15-28L7-5Z" transform="rotate(216)"/><path d="M-4-8L-10-32Q2-37 15-28L7-5Z" transform="rotate(288)"/><circle r="8" fill="#AAB5AE"/></g></g></g>
