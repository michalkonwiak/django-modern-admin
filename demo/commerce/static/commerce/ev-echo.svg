        <path d="M337 280C500 178 955 190 1195 357M337 343C530 245 952 281 1195 403M337 416C551 333 946 350 1195 472M337 478C539 405 942 410 1195 510M337 517C550 463 935 460 1196 545" fill="none" stroke="var(--ev-trim)" stroke-width="2.2"/>
